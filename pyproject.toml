[project]
name = "chess-elo-predictor"
version = "0.1.0"
description = "Predicting chess results using metadata and early-game features."
authors = [
    {name = "HanaAkabawy"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (<3.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "xgboost (>=3.2.0,<4.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "python-chess (>=1.999,<2.0)",
    "mlflow (>=3.10.1,<4.0.0)",
    "kaggle (>=2.1.0,<3.0.0)",
    "imbalanced-learn (>=0.14.1,<0.15.0)"
    "kaggle (>=2.1.0,<3.0.0)",
    "plotly (>=6.7.0,<7.0.0)"
]
[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black[jupyter] (>=26.3.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)"
]
