name: CI/CD

on:
  push:
    branches: [ Abdelrahman ]
  pull_request:
    branches: [ Abdelrahman ]

jobs:
  ci:
    env:
      PYTHONUTF8: "1"   
      PYTHONIOENCODING: "utf-8"
      MLFLOW_TRACKING_URI: "file:./mlruns"
      MLFLOW_BACKEND_STORE_URI: "file:./mlruns"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "./mlruns/artifacts"
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14.4"]
        test-file:
          - tests/test_data_loading.py
          - tests/test_transform.py
          - tests/test_build_features.py
          - tests/test_validate.py

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Add Poetry to PATH
      run: echo "$env:USERPROFILE\.local\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
      shell: pwsh

    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        make setup

    - name: Code Quality - Format & Lint
      run: |
        make lint-all
      continue-on-error: true

    - name: Run Unit Test File
      run: |
        python -m poetry run pytest ${{ matrix.test-file }} --tb=short -v --maxfail=999 || true
      continue-on-error: true

    - name: Run Integration Tests
      run: |
        python -m poetry run pytest tests/test_integration_pipeline.py -v --tb=short -s || true
      continue-on-error: true

    - name: Run All Tests with Coverage
      run: |
        python -m poetry run pytest tests/ --cov=src --cov-report=html:reports/coverage/html --cov-report=xml:reports/coverage/coverage.xml --cov-report=term-missing --junitxml=reports/junit-results.xml || true
      continue-on-error: true

    - name: Generate Test Reports
      run: |
        python -m poetry run python scripts/generate_test_report.py
      continue-on-error: true

    - name: Upload Test and Coverage Reports
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          reports/coverage/
          reports/test-results/
          reports/junit-results.xml
      if: always()

    - name: Run Data Pipeline (All Phases)
      run: |
        make pipeline

    - name: Upload MLflow Run Data
      uses: actions/upload-artifact@v4
      with:
        name: mlflow-runs
        path: mlruns/
      if: always()

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: data-artifacts
        path: |
          data/intermediate/
          reports/results/

  mlflow-registry:
    needs: ci
    if: github.ref == 'refs/heads/Abdelrahman' && github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14.4'

      - name: Install Poetry and MLflow
        run: |
          python -m pip install --upgrade pip
          pip install poetry mlflow

      - name: Download MLflow runs
        uses: actions/download-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/

      - name: Log and register best models
        run: |
          python -c "
          import mlflow
          import json
          from pathlib import Path
          
          mlflow.set_tracking_uri('file:./mlruns')
          
          # Search all experiments
          experiments = mlflow.search_experiments()
          registered_count = 0
          
          for experiment in experiments:
              runs = mlflow.search_runs(experiment_ids=[experiment.experiment_id], order_by=['metrics.accuracy DESC'])
              if len(runs) > 0:
                  best_run = runs.iloc[0]
                  print(f'Best run in {experiment.name}: {best_run.run_id} (accuracy: {best_run[\"metrics.accuracy\"]:.4f})')
                  registered_count += 1
          
          print(f'\\nFound {registered_count} experiments with tracked models')
          "
        continue-on-error: true

  cd:
    needs: ci
    if: github.ref == 'refs/heads/Abdelrahman' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14.4'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          
      
      - name: Add Poetry to PATH
        run: echo "$env:USERPROFILE\.local\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
        shell: pwsh

      - name: Install dependencies
        run: python -m poetry install

      - name: Generate Static Dashboard
        run: python -m poetry run python scripts/generate_static_dashboard.py

      - name: Copy Reports to Static Site
        run: |
          Copy-Item -Path "reports/coverage" -Destination "dist/coverage" -Recurse -Force
          Copy-Item -Path "reports/test-results" -Destination "dist/test-results" -Recurse -Force
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
