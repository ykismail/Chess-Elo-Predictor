name: CI/CD

on:
  push:
    branches: [ Abdelrahman ]
  pull_request:
    branches: [ Abdelrahman ]

jobs:
  ci:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14.4"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | py -

    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        make setup

    - name: Code Quality - Format & Lint
      run: |
        make lint-all

    - name: Run Tests with Pytest
      run: |
        make test

    - name: Run Data Pipeline (All Phases)
      run: |
        make pipeline

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: data-artifacts
        path: |
          data/intermediate/
          reports/results/

  cd:
    needs: ci
    if: github.ref == 'refs/heads/Abdelrahman' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14.4'

      - name: Install Poetry
        run: |
          (Invoke-WebRequest -Uri https://install.python-poetry.org -UseBasicParsing).Content | py -
      
      - name: Install dependencies
        run: poetry install

      - name: Install stlite
        run: poetry run pip install stlite

      - name: Build static site
        run: |
          poetry run stlite build src/visualization/dashboard.py --dest dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
