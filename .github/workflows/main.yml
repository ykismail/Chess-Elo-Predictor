name: CI/CD

on:
  push:
    branches: [ Abdelrahman ]
  pull_request:
    branches: [ Abdelrahman ]

jobs:
  ci:
    env:
      PYTHONUTF8: "1"   
      PYTHONIOENCODING: "utf-8" 
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14.4"]
        test-file:
          - tests/test_data_loading.py
          - tests/test_transform.py
          - tests/test_build_features.py
          - tests/test_validate.py

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        python -m pip install --upgrade pip
        pip install poetry

    - name: Add Poetry to PATH
      run: echo "$env:USERPROFILE\.local\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
      shell: pwsh

    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        make setup

    - name: Code Quality - Format & Lint
      run: |
        make lint-all
      continue-on-error: true

    - name: Run Unit Test File
      run: |
        python -m poetry run pytest ${{ matrix.test-file }} --tb=short -v --maxfail=999 || true
      continue-on-error: true

    - name: Run Data Pipeline (All Phases)
      run: |
        make pipeline

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: data-artifacts
        path: |
          data/intermediate/
          reports/results/

  cd:
    # needs: ci
    if: github.ref == 'refs/heads/Abdelrahman' && github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14.4'

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          
      
      - name: Add Poetry to PATH
        run: echo "$env:USERPROFILE\.local\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
        shell: pwsh

      - name: Install dependencies
        run: python -m poetry install

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

    
      - name: Install stlite
        run: npm install -g stlite

      - name: Build static site
        run: stlite build src/visualization/dashboard.py --dest dist


      # - name: Build static site
      #   run: |
      #     python -m poetry run stlite build src/visualization/dashboard.py --dest dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
